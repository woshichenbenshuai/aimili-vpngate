services:
  aimilivpn:
    build: .
    container_name: aimilivpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      # Web UI.
      - "17002:17002"
      # Host-local proxy for sing-box; not exposed on public interfaces.
      - "127.0.0.1:8317:8317"
    expose:
      - "8317"
    networks:
      - aimili-net
    environment:
      VPNGATE_DATA_DIR: /data
      LOCAL_PROXY_HOST: 0.0.0.0
      LOCAL_PROXY_PORT: "8317"
      UI_HOST: 0.0.0.0
      UI_PORT: "17002"
      PUBLICVPNLIST_URL: https://publicvpnlist.com/
      PUBLICVPNLIST_LIMIT: "0"
      PUBLICVPNLIST_FILTER_CANDIDATES: "0"
      PUBLICVPNLIST_MAX_CONFIG_BYTES: "262144"
      MAX_NODE_LIST: "0"
      MAX_TEST_NODES: "20"
      MAX_TEST_WORKERS: "10"
      MAX_SCAN_ROWS: "1000"
      ACCEPTED_EXIT_IP_TYPES: residential,mobile
      MAX_NODE_SESSIONS: "30"
      MAX_NODE_PING: "350"
      MIN_NODE_SPEED: "1000000"
      DENY_NODE_IP_PREFIXES: 219.100.37.,219.100.36.
      BLACKLIST_TTL_SECONDS: "21600"
    volumes:
      - ./vpngate_data:/data

networks:
  aimili-net:
    name: aimili-net
