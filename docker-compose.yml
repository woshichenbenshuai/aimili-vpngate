services:
  aimilivpn:
    build: .
    container_name: aimilivpn
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPNGATE_DATA_DIR: /data
      LOCAL_PROXY_HOST: 127.0.0.1
      LOCAL_PROXY_PORT: "8317"
      UI_HOST: 0.0.0.0
      UI_PORT: "6379"
      PUBLICVPNLIST_URL: https://publicvpnlist.com/
      PUBLICVPNLIST_LIMIT: "100"
      VPNBOOK_ENABLED: "1"
      VPNBOOK_LIMIT: "40"
      VPNBOOK_PROTOCOLS: tcp443,tcp80,udp53,udp25000
      MAX_SCAN_ROWS: "2000"
      ACCEPTED_EXIT_IP_TYPES: residential,mobile,normal,hosting
      MAX_NODE_SESSIONS: "0"
      MAX_NODE_PING: "0"
      MIN_NODE_SPEED: "0"
      DENY_NODE_IP_PREFIXES: ""
      BLACKLIST_TTL_SECONDS: "21600"
    volumes:
      - ./vpngate_data:/data
